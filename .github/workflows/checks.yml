name: Check deployment builds
on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/aliyun-production']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - base: /
            origin: https://create.byheyang.cn
          - base: /personal-portfolio/
            origin: https://cocobolo111-png.github.io
    env:
      PORTFOLIO_BASE: ${{ matrix.base }}
      PORTFOLIO_ORIGIN: ${{ matrix.origin }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ask-hy
      - run: pnpm test:fun
      - run: pnpm build
      - run: node scripts/deploy/check-dist.mjs
      - run: node scripts/deploy/manifest.mjs
      - run: bash scripts/deploy/test-release.sh
